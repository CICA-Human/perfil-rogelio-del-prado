# Tu semblanza. Separa los párrafos con una línea en blanco.
# Usa *asteriscos* para poner títulos de obras en cursivas.
bio: |
  Doctor en Filosofía por la Universidad Nacional Autónoma de México, con mención honorífica, y Medalla de Plata Alfonso Caso (UNAM, 2004). Desde 2012 es profesor investigador de tiempo completo en la Facultad de Comunicación de la Universidad Anáhuac México, donde es titular del Centro de Investigación para la Comunicación Aplicada (CICA) y editor jefe de *Sintaxis*, la revista científica del Centro.

  Su trabajo cruza la filosofía con los estudios de comunicación. Ha escrito sobre los derechos de las audiencias, la ética en las redes sociales digitales, la justicia y el espacio público, y más recientemente sobre los dilemas éticos de la inteligencia artificial en el campo audiovisual.

  Es autor de *Márgenes de la comunicación* (2024), *Ética de la comunicación* (2018) y *Políticas para la justicia y la comunicación* (2016), y coordinador de *Ética y los derechos de las audiencias* (2016) y *Ética y redes sociales* (2014). Imparte ética en el Doctorado en Investigación de la Comunicación.

distinciones:
